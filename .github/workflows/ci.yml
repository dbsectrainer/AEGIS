---
name: AEGIS CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.17.1"
  MARKDOWNLINT_VERSION: "0.45.0"

jobs:
  validate-and-verify:
    name: Validate and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip install playwright

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install repository tooling
        run: |
          npm install --global markdownlint-cli@${{ env.MARKDOWNLINT_VERSION }}
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: v0.76.1
          cache: true

      - name: Repository contract tests
        run: make test-repository

      - name: Markdown lint
        run: make docs-lint

      - name: Terraform format, validate, and native tests
        run: make test-terraform

      - name: Offline Trivy HIGH/CRITICAL scan
        run: make test-security

      - name: Documentation portal build
        run: make docs

      - name: Browser E2E and screenshots
        run: make test-e2e

      - name: Monitoring configuration validation
        run: make monitoring-init

      - name: Deployment dry run
        run: make deploy-dry-run

      - name: Offline compliance audit
        run: make security-compliance

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-evidence
          path: |
            docs/evidence/
            docs/site/
            compliance-reports/
          if-no-files-found: warn

  local-emulation:
    name: Local AWS emulation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb,sqs,sns,iam,sts,kms,ec2,logs
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install AWS CLI and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli jq curl

      - name: Run LocalStack Terraform fixture
        env:
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: tests/localstack/run-localstack-tests.sh --no-start

      - name: Upload LocalStack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-localstack-evidence
          path: docs/evidence/localstack/
          if-no-files-found: warn
