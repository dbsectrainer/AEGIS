name: 'Documentation Update'

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'diagrams/**'
      - 'templates/**'
      - 'README.md'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - 'diagrams/**'
      - 'templates/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  documentation-check:
    name: 'Documentation Check'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install markdownlint
      run: npm install -g markdownlint-cli

    - name: Run markdownlint
      run: markdownlint '**/*.md' --ignore node_modules

    - name: Check for Broken Links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.github/workflows/mlc_config.json'
        folder-path: 'docs'
        max-depth: -1

    - name: Check Spelling
      uses: crate-ci/typos@master
      with:
        files: ./docs/

    - name: Generate Documentation Index
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "# Documentation Index" > docs/INDEX.md
        echo "" >> docs/INDEX.md
        echo "Generated on: $(date)" >> docs/INDEX.md
        echo "" >> docs/INDEX.md
        
        # Architecture Documentation
        echo "## Architecture" >> docs/INDEX.md
        for file in docs/architecture/*.md; do
          name=$(basename "$file" .md)
          echo "- [$name]($file)" >> docs/INDEX.md
        done
        
        # Compliance Documentation
        echo "" >> docs/INDEX.md
        echo "## Compliance" >> docs/INDEX.md
        for file in docs/compliance/*.md; do
          name=$(basename "$file" .md)
          echo "- [$name]($file)" >> docs/INDEX.md
        done
        
        # Security Documentation
        echo "" >> docs/INDEX.md
        echo "## Security" >> docs/INDEX.md
        for file in docs/security/**/*.md; do
          name=$(basename "$file" .md)
          echo "- [$name]($file)" >> docs/INDEX.md
        done
        
        # Operations Documentation
        echo "" >> docs/INDEX.md
        echo "## Operations" >> docs/INDEX.md
        for file in docs/operations/*.md; do
          name=$(basename "$file" .md)
          echo "- [$name]($file)" >> docs/INDEX.md
        done

    - name: Generate Architecture Diagrams
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ -f "diagrams/generate.sh" ]; then
          chmod +x diagrams/generate.sh
          ./diagrams/generate.sh
        fi

    - name: Commit Documentation Updates
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/INDEX.md
        git add diagrams/*.svg
        git commit -m "Update documentation index and diagrams" || echo "No changes to commit"
        git push

    - name: Create Documentation Report
      if: always()
      run: |
        echo "# Documentation Quality Report" > docs-report.md
        echo "## Summary" >> docs-report.md
        echo "- Repository: ${{ github.repository }}" >> docs-report.md
        echo "- Branch: ${{ github.ref }}" >> docs-report.md
        echo "- Timestamp: $(date)" >> docs-report.md
        
        echo "## Linting Results" >> docs-report.md
        markdownlint '**/*.md' --ignore node_modules || true
        
        echo "## Link Check Results" >> docs-report.md
        # Add link check results
        
        echo "## Spelling Check Results" >> docs-report.md
        # Add spelling check results

    - name: Upload Documentation Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: documentation-report
        path: docs-report.md

    - name: Notify on Documentation Issues
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        channel-id: ${{ secrets.DOCS_CHANNEL_ID }}
        slack-message: |
          :warning: Documentation Issues Detected
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref }}
          Workflow: ${{ github.workflow }}
          See detailed report in GitHub Actions artifacts
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
