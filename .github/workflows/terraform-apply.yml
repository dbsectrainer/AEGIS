name: 'Terraform Apply'

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      region:
        description: 'Region to deploy to'
        required: true
        type: choice
        options:
          - northeast
          - southeast
          - west

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
  TF_IN_AUTOMATION: true

jobs:
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    
    strategy:
      matrix:
        environment: ${{ github.event.inputs.environment && fromJSON(format('["%s"]', github.event.inputs.environment)) || fromJSON('["development", "staging", "production"]') }}
        region: ${{ github.event.inputs.region && fromJSON(format('["%s"]', github.event.inputs.region)) || fromJSON('["northeast", "southeast", "west"]') }}

    concurrency:
      group: ${{ matrix.environment }}-${{ matrix.region }}
      cancel-in-progress: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: "1.5.0"
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ matrix.environment }}/${{ matrix.region }}/terraform.tfstate" \
          -backend-config="region=${{ secrets.AWS_REGION }}"
      working-directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Terraform Plan
      id: plan
      run: |
        terraform plan \
          -var-file="terraform.tfvars" \
          -out=tfplan
      working-directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Run Security Scan
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Run Cost Estimation
      uses: infracost/infracost-action@v3
      with:
        path: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}
        terraform_plan_flags: "-var-file=terraform.tfvars"
        api_key: ${{ secrets.INFRACOST_API_KEY }}

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      run: |
        terraform apply -auto-approve tfplan
      working-directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
        slack-message: |
          :white_check_mark: Terraform Apply Succeeded
          Environment: ${{ matrix.environment }}
          Region: ${{ matrix.region }}
          Triggered by: ${{ github.actor }}
          Workflow: ${{ github.workflow }}
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
        slack-message: |
          :x: Terraform Apply Failed
          Environment: ${{ matrix.environment }}
          Region: ${{ matrix.region }}
          Triggered by: ${{ github.actor }}
          Workflow: ${{ github.workflow }}
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
