name: 'Terraform Plan'

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
  TF_IN_AUTOMATION: true

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [development, staging, production]
        region: [northeast, southeast, west]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: "1.5.0"
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Format
      run: terraform fmt -check -recursive
      working-directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ matrix.environment }}/${{ matrix.region }}/terraform.tfstate" \
          -backend-config="region=${{ secrets.AWS_REGION }}"
      working-directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Terraform Validate
      run: terraform validate
      working-directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Terraform Plan
      run: |
        terraform plan \
          -var-file="terraform.tfvars" \
          -out=tfplan
      working-directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v3
      with:
        name: tfplan-${{ matrix.environment }}-${{ matrix.region }}
        path: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}/tfplan

    - name: Run Security Scan
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}

    - name: Run Cost Estimation
      uses: infracost/infracost-action@v3
      with:
        path: terraform/environments/${{ matrix.environment }}/${{ matrix.region }}
        terraform_plan_flags: "-var-file=terraform.tfvars"
        api_key: ${{ secrets.INFRACOST_API_KEY }}

    - name: Post Plan Summary
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Terraform Plan 📝
          *Environment:* \`${{ matrix.environment }}\`
          *Region:* \`${{ matrix.region }}\`
          
          <details><summary>Show Plan</summary>
          
          \`\`\`\n
          ${process.env.PLAN}
          \`\`\`
          
          </details>
          
          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
