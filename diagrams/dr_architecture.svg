<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#f8f9fa"/>
    
    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50">
        Disaster Recovery Architecture
    </text>

    <!-- Primary Region -->
    <rect x="50" y="70" width="330" height="240" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="215" y="90" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1976d2">Primary Region (US East)</text>

    <!-- Primary Components -->
    <rect x="60" y="110" width="310" height="190" rx="5" fill="#fff"/>
    
    <!-- Compute -->
    <rect x="70" y="120" width="140" height="80" rx="5" fill="#bbdefb"/>
    <text x="140" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Compute</text>
    <text x="140" y="160" text-anchor="middle" font-family="Arial" font-size="10">- ECS/AKS Clusters</text>
    <text x="140" y="175" text-anchor="middle" font-family="Arial" font-size="10">- Load Balancers</text>
    <text x="140" y="190" text-anchor="middle" font-family="Arial" font-size="10">- Auto-scaling</text>

    <!-- Storage -->
    <rect x="220" y="120" width="140" height="80" rx="5" fill="#bbdefb"/>
    <text x="290" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Storage</text>
    <text x="290" y="160" text-anchor="middle" font-family="Arial" font-size="10">- S3/Blob Storage</text>
    <text x="290" y="175" text-anchor="middle" font-family="Arial" font-size="10">- Database Primary</text>
    <text x="290" y="190" text-anchor="middle" font-family="Arial" font-size="10">- Real-time Replication</text>

    <!-- Network -->
    <rect x="70" y="210" width="290" height="80" rx="5" fill="#bbdefb"/>
    <text x="215" y="230" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Network</text>
    <text x="215" y="250" text-anchor="middle" font-family="Arial" font-size="10">- Direct Connect/ExpressRoute</text>
    <text x="215" y="265" text-anchor="middle" font-family="Arial" font-size="10">- VPN Backup</text>
    <text x="215" y="280" text-anchor="middle" font-family="Arial" font-size="10">- Route 53/Traffic Manager</text>

    <!-- Secondary Region -->
    <rect x="420" y="70" width="330" height="240" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="585" y="90" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ff9800">Secondary Region (US West)</text>

    <!-- Secondary Components -->
    <rect x="430" y="110" width="310" height="190" rx="5" fill="#fff"/>
    
    <!-- Compute -->
    <rect x="440" y="120" width="140" height="80" rx="5" fill="#ffe0b2"/>
    <text x="510" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Compute</text>
    <text x="510" y="160" text-anchor="middle" font-family="Arial" font-size="10">- Standby Clusters</text>
    <text x="510" y="175" text-anchor="middle" font-family="Arial" font-size="10">- Warm Standby</text>
    <text x="510" y="190" text-anchor="middle" font-family="Arial" font-size="10">- Auto-provisioning</text>

    <!-- Storage -->
    <rect x="590" y="120" width="140" height="80" rx="5" fill="#ffe0b2"/>
    <text x="660" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Storage</text>
    <text x="660" y="160" text-anchor="middle" font-family="Arial" font-size="10">- Cross-Region Replica</text>
    <text x="660" y="175" text-anchor="middle" font-family="Arial" font-size="10">- Database Secondary</text>
    <text x="660" y="190" text-anchor="middle" font-family="Arial" font-size="10">- Backup Storage</text>

    <!-- Network -->
    <rect x="440" y="210" width="290" height="80" rx="5" fill="#ffe0b2"/>
    <text x="585" y="230" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Network</text>
    <text x="585" y="250" text-anchor="middle" font-family="Arial" font-size="10">- Region Connectivity</text>
    <text x="585" y="265" text-anchor="middle" font-family="Arial" font-size="10">- DNS Failover</text>
    <text x="585" y="280" text-anchor="middle" font-family="Arial" font-size="10">- Load Balancing</text>

    <!-- Replication & Sync -->
    <rect x="50" y="330" width="700" height="120" rx="10" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
    <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#66bb6a">Data Replication & Synchronization</text>

    <!-- Data Sync -->
    <rect x="60" y="370" width="330" height="70" rx="5" fill="#fff"/>
    <text x="225" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Real-time Sync</text>
    <text x="225" y="410" text-anchor="middle" font-family="Arial" font-size="10">- Database Replication</text>
    <text x="225" y="425" text-anchor="middle" font-family="Arial" font-size="10">- Storage Replication</text>

    <!-- Backup -->
    <rect x="410" y="370" width="330" height="70" rx="5" fill="#fff"/>
    <text x="575" y="390" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Backup Management</text>
    <text x="575" y="410" text-anchor="middle" font-family="Arial" font-size="10">- Regular Backups</text>
    <text x="575" y="425" text-anchor="middle" font-family="Arial" font-size="10">- Point-in-Time Recovery</text>

    <!-- DR Management -->
    <rect x="50" y="470" width="700" height="110" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="400" y="490" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#9c27b0">DR Management</text>

    <!-- Monitoring -->
    <rect x="60" y="510" width="215" height="60" rx="5" fill="#fff"/>
    <text x="167" y="530" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Monitoring</text>
    <text x="167" y="545" text-anchor="middle" font-family="Arial" font-size="10">Health Checks</text>
    <text x="167" y="560" text-anchor="middle" font-family="Arial" font-size="10">Performance Metrics</text>

    <!-- Testing -->
    <rect x="295" y="510" width="215" height="60" rx="5" fill="#fff"/>
    <text x="402" y="530" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Testing</text>
    <text x="402" y="545" text-anchor="middle" font-family="Arial" font-size="10">DR Drills</text>
    <text x="402" y="560" text-anchor="middle" font-family="Arial" font-size="10">Failover Testing</text>

    <!-- Automation -->
    <rect x="530" y="510" width="210" height="60" rx="5" fill="#fff"/>
    <text x="635" y="530" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Automation</text>
    <text x="635" y="545" text-anchor="middle" font-family="Arial" font-size="10">Failover Scripts</text>
    <text x="635" y="560" text-anchor="middle" font-family="Arial" font-size="10">Recovery Automation</text>

    <!-- Replication Arrows -->
    <path d="M380 160 L420 160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M380 250 L420 250" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Arrow Marker -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2c3e50"/>
        </marker>
    </defs>
</svg>
