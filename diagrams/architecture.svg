<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#f8f9fa"/>
    
    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50">
        USCG Multi-Cloud Architecture
    </text>

    <!-- AWS GovCloud (Background) -->
    <rect x="50" y="70" width="340" height="480" rx="15" fill="#f1f8ff" stroke="#4a90e2" stroke-width="2"/>
    <text x="220" y="95" font-family="Arial" font-size="16" fill="#4a90e2">AWS GovCloud</text>

    <!-- Azure Government (Background) -->
    <rect x="410" y="70" width="340" height="480" rx="15" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="580" y="95" font-family="Arial" font-size="16" fill="#ff9800">Azure Government</text>

    <!-- AWS Security Layer -->
    <rect x="70" y="110" width="300" height="420" rx="10" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
    <text x="220" y="135" font-family="Arial" font-size="14" fill="#2e7d32">Security Controls</text>

    <!-- Azure Security Layer -->
    <rect x="430" y="110" width="300" height="420" rx="10" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
    <text x="580" y="135" font-family="Arial" font-size="14" fill="#2e7d32">Security Controls</text>

    <!-- AWS Components -->
    <!-- Compute -->
    <rect x="90" y="150" width="260" height="100" rx="8" fill="#fff" stroke="#3f51b5" stroke-width="2"/>
    <text x="220" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#3f51b5">
        Compute Services
    </text>
    <rect x="100" y="190" width="115" height="25" rx="5" fill="#c5cae9"/>
    <text x="157" y="207" text-anchor="middle" font-family="Arial" font-size="12">ECS/EKS</text>
    <rect x="225" y="190" width="115" height="25" rx="5" fill="#c5cae9"/>
    <text x="282" y="207" text-anchor="middle" font-family="Arial" font-size="12">Lambda</text>

    <!-- Network -->
    <rect x="90" y="270" width="260" height="100" rx="8" fill="#fff" stroke="#009688" stroke-width="2"/>
    <text x="220" y="295" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#009688">
        Network Services
    </text>
    <rect x="100" y="310" width="115" height="25" rx="5" fill="#b2dfdb"/>
    <text x="157" y="327" text-anchor="middle" font-family="Arial" font-size="12">Transit Gateway</text>
    <rect x="225" y="310" width="115" height="25" rx="5" fill="#b2dfdb"/>
    <text x="282" y="327" text-anchor="middle" font-family="Arial" font-size="12">Direct Connect</text>

    <!-- Storage -->
    <rect x="90" y="390" width="260" height="100" rx="8" fill="#fff" stroke="#e91e63" stroke-width="2"/>
    <text x="220" y="415" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e91e63">
        Storage Services
    </text>
    <rect x="100" y="430" width="115" height="25" rx="5" fill="#f8bbd0"/>
    <text x="157" y="447" text-anchor="middle" font-family="Arial" font-size="12">S3</text>
    <rect x="225" y="430" width="115" height="25" rx="5" fill="#f8bbd0"/>
    <text x="282" y="447" text-anchor="middle" font-family="Arial" font-size="12">EBS</text>

    <!-- Azure Components -->
    <!-- Compute -->
    <rect x="450" y="150" width="260" height="100" rx="8" fill="#fff" stroke="#3f51b5" stroke-width="2"/>
    <text x="580" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#3f51b5">
        Compute Services
    </text>
    <rect x="460" y="190" width="115" height="25" rx="5" fill="#c5cae9"/>
    <text x="517" y="207" text-anchor="middle" font-family="Arial" font-size="12">AKS</text>
    <rect x="585" y="190" width="115" height="25" rx="5" fill="#c5cae9"/>
    <text x="642" y="207" text-anchor="middle" font-family="Arial" font-size="12">Functions</text>

    <!-- Network -->
    <rect x="450" y="270" width="260" height="100" rx="8" fill="#fff" stroke="#009688" stroke-width="2"/>
    <text x="580" y="295" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#009688">
        Network Services
    </text>
    <rect x="460" y="310" width="115" height="25" rx="5" fill="#b2dfdb"/>
    <text x="517" y="327" text-anchor="middle" font-family="Arial" font-size="12">Virtual WAN</text>
    <rect x="585" y="310" width="115" height="25" rx="5" fill="#b2dfdb"/>
    <text x="642" y="327" text-anchor="middle" font-family="Arial" font-size="12">ExpressRoute</text>

    <!-- Storage -->
    <rect x="450" y="390" width="260" height="100" rx="8" fill="#fff" stroke="#e91e63" stroke-width="2"/>
    <text x="580" y="415" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e91e63">
        Storage Services
    </text>
    <rect x="460" y="430" width="115" height="25" rx="5" fill="#f8bbd0"/>
    <text x="517" y="447" text-anchor="middle" font-family="Arial" font-size="12">Blob Storage</text>
    <rect x="585" y="430" width="115" height="25" rx="5" fill="#f8bbd0"/>
    <text x="642" y="447" text-anchor="middle" font-family="Arial" font-size="12">Managed Disks</text>

    <!-- Cross-Cloud Connection -->
    <path d="M370 320 Q400 320 430 320" stroke="#795548" stroke-width="3" fill="none"/>
    <text x="400" y="310" text-anchor="middle" font-family="Arial" font-size="12" fill="#795548">Cross-Cloud</text>
    <text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="12" fill="#795548">Connectivity</text>
</svg>
