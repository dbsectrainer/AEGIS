<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#f8f9fa"/>
    
    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50">
        Compliance Control Framework
    </text>

    <!-- FedRAMP High -->
    <rect x="50" y="70" width="700" height="120" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="400" y="90" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1976d2">FedRAMP High Controls</text>
    
    <!-- Control Categories -->
    <rect x="60" y="110" width="165" height="70" rx="5" fill="#fff"/>
    <text x="142" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Access Control</text>
    <text x="142" y="145" text-anchor="middle" font-family="Arial" font-size="10">AC-1 through AC-25</text>
    <text x="142" y="160" text-anchor="middle" font-family="Arial" font-size="10">Authentication</text>
    <text x="142" y="175" text-anchor="middle" font-family="Arial" font-size="10">Authorization</text>

    <rect x="235" y="110" width="165" height="70" rx="5" fill="#fff"/>
    <text x="317" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Audit & Accountability</text>
    <text x="317" y="145" text-anchor="middle" font-family="Arial" font-size="10">AU-1 through AU-16</text>
    <text x="317" y="160" text-anchor="middle" font-family="Arial" font-size="10">Logging</text>
    <text x="317" y="175" text-anchor="middle" font-family="Arial" font-size="10">Monitoring</text>

    <rect x="410" y="110" width="165" height="70" rx="5" fill="#fff"/>
    <text x="492" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">System & Comms</text>
    <text x="492" y="145" text-anchor="middle" font-family="Arial" font-size="10">SC-1 through SC-39</text>
    <text x="492" y="160" text-anchor="middle" font-family="Arial" font-size="10">Encryption</text>
    <text x="492" y="175" text-anchor="middle" font-family="Arial" font-size="10">Network Security</text>

    <rect x="585" y="110" width="155" height="70" rx="5" fill="#fff"/>
    <text x="662" y="130" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Risk Assessment</text>
    <text x="662" y="145" text-anchor="middle" font-family="Arial" font-size="10">RA-1 through RA-9</text>
    <text x="662" y="160" text-anchor="middle" font-family="Arial" font-size="10">Vulnerability Mgmt</text>
    <text x="662" y="175" text-anchor="middle" font-family="Arial" font-size="10">Threat Analysis</text>

    <!-- NIST 800-53 -->
    <rect x="50" y="210" width="700" height="120" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="400" y="230" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ff9800">NIST 800-53 Rev 5</text>

    <!-- Control Families -->
    <rect x="60" y="250" width="330" height="70" rx="5" fill="#fff"/>
    <text x="225" y="270" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Security Controls</text>
    <text x="225" y="285" text-anchor="middle" font-family="Arial" font-size="10">- 20 Control Families</text>
    <text x="225" y="300" text-anchor="middle" font-family="Arial" font-size="10">- 1000+ Control Items</text>
    <text x="225" y="315" text-anchor="middle" font-family="Arial" font-size="10">- Control Enhancements</text>

    <rect x="410" y="250" width="330" height="70" rx="5" fill="#fff"/>
    <text x="575" y="270" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Privacy Controls</text>
    <text x="575" y="285" text-anchor="middle" font-family="Arial" font-size="10">- Privacy Framework</text>
    <text x="575" y="300" text-anchor="middle" font-family="Arial" font-size="10">- Privacy Engineering</text>
    <text x="575" y="315" text-anchor="middle" font-family="Arial" font-size="10">- Privacy Assessment</text>

    <!-- DoD Cloud SRG -->
    <rect x="50" y="350" width="700" height="120" rx="10" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
    <text x="400" y="370" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#66bb6a">DoD Cloud SRG</text>

    <!-- Impact Levels -->
    <rect x="60" y="390" width="215" height="70" rx="5" fill="#fff"/>
    <text x="167" y="410" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Impact Level 4</text>
    <text x="167" y="425" text-anchor="middle" font-family="Arial" font-size="10">Controlled Unclassified</text>
    <text x="167" y="440" text-anchor="middle" font-family="Arial" font-size="10">Information (CUI)</text>
    <text x="167" y="455" text-anchor="middle" font-family="Arial" font-size="10">Federal Contract Info</text>

    <rect x="295" y="390" width="215" height="70" rx="5" fill="#fff"/>
    <text x="402" y="410" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Impact Level 5</text>
    <text x="402" y="425" text-anchor="middle" font-family="Arial" font-size="10">Controlled Unclassified</text>
    <text x="402" y="440" text-anchor="middle" font-family="Arial" font-size="10">Information (CUI)</text>
    <text x="402" y="455" text-anchor="middle" font-family="Arial" font-size="10">Higher Sensitivity</text>

    <rect x="530" y="390" width="210" height="70" rx="5" fill="#fff"/>
    <text x="635" y="410" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Impact Level 6</text>
    <text x="635" y="425" text-anchor="middle" font-family="Arial" font-size="10">Classified Information</text>
    <text x="635" y="440" text-anchor="middle" font-family="Arial" font-size="10">Secret and Below</text>
    <text x="635" y="455" text-anchor="middle" font-family="Arial" font-size="10">Special Requirements</text>

    <!-- USCG Requirements -->
    <rect x="50" y="490" width="700" height="90" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="400" y="510" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#9c27b0">USCG Requirements</text>

    <!-- USCG Controls -->
    <rect x="60" y="530" width="330" height="40" rx="5" fill="#fff"/>
    <text x="225" y="550" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Security Technical Implementation Guides (STIGs)</text>
    <text x="225" y="565" text-anchor="middle" font-family="Arial" font-size="10">Technical Security Controls</text>

    <rect x="410" y="530" width="330" height="40" rx="5" fill="#fff"/>
    <text x="575" y="550" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Information Assurance Policy</text>
    <text x="575" y="565" text-anchor="middle" font-family="Arial" font-size="10">Agency-Specific Requirements</text>

    <!-- Flow Arrows -->
    <path d="M400 190 L400 210" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M400 330 L400 350" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M400 470 L400 490" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Arrow Marker -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2c3e50"/>
        </marker>
    </defs>
</svg>
