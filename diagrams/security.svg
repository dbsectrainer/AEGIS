<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#f8f9fa"/>
    
    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50">
        GOV Security Architecture
    </text>

    <!-- FedRAMP High Boundary -->
    <rect x="50" y="70" width="700" height="480" rx="15" fill="#f1f8ff" stroke="#4a90e2" stroke-width="2"/>
    <text x="400" y="95" font-family="Arial" font-size="16" fill="#4a90e2">FedRAMP High Authorization Boundary</text>

    <!-- Zero Trust Perimeter -->
    <rect x="70" y="110" width="660" height="420" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="400" y="135" font-family="Arial" font-size="14" fill="#e65100">Zero Trust Security Perimeter</text>

    <!-- Identity and Access Management -->
    <rect x="90" y="150" width="200" height="160" rx="8" fill="#fff" stroke="#3f51b5" stroke-width="2"/>
    <text x="190" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#3f51b5">
        Identity &amp; Access
    </text>
    <rect x="100" y="190" width="180" height="25" rx="5" fill="#c5cae9"/>
    <text x="190" y="207" text-anchor="middle" font-family="Arial" font-size="12">PIV/CAC Integration</text>
    <rect x="100" y="225" width="180" height="25" rx="5" fill="#c5cae9"/>
    <text x="190" y="242" text-anchor="middle" font-family="Arial" font-size="12">Multi-Factor Auth</text>
    <rect x="100" y="260" width="180" height="25" rx="5" fill="#c5cae9"/>
    <text x="190" y="277" text-anchor="middle" font-family="Arial" font-size="12">RBAC/ABAC</text>

    <!-- Network Security -->
    <rect x="300" y="150" width="200" height="160" rx="8" fill="#fff" stroke="#009688" stroke-width="2"/>
    <text x="400" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#009688">
        Network Security
    </text>
    <rect x="310" y="190" width="180" height="25" rx="5" fill="#b2dfdb"/>
    <text x="400" y="207" text-anchor="middle" font-family="Arial" font-size="12">Next-Gen Firewalls</text>
    <rect x="310" y="225" width="180" height="25" rx="5" fill="#b2dfdb"/>
    <text x="400" y="242" text-anchor="middle" font-family="Arial" font-size="12">IDS/IPS</text>
    <rect x="310" y="260" width="180" height="25" rx="5" fill="#b2dfdb"/>
    <text x="400" y="277" text-anchor="middle" font-family="Arial" font-size="12">DDoS Protection</text>

    <!-- Data Protection -->
    <rect x="510" y="150" width="200" height="160" rx="8" fill="#fff" stroke="#e91e63" stroke-width="2"/>
    <text x="610" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e91e63">
        Data Protection
    </text>
    <rect x="520" y="190" width="180" height="25" rx="5" fill="#f8bbd0"/>
    <text x="610" y="207" text-anchor="middle" font-family="Arial" font-size="12">FIPS 140-2 Encryption</text>
    <rect x="520" y="225" width="180" height="25" rx="5" fill="#f8bbd0"/>
    <text x="610" y="242" text-anchor="middle" font-family="Arial" font-size="12">Key Management</text>
    <rect x="520" y="260" width="180" height="25" rx="5" fill="#f8bbd0"/>
    <text x="610" y="277" text-anchor="middle" font-family="Arial" font-size="12">DLP</text>

    <!-- Security Operations -->
    <rect x="90" y="320" width="620" height="190" rx="8" fill="#fff" stroke="#795548" stroke-width="2"/>
    <text x="400" y="345" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#795548">
        Security Operations
    </text>

    <!-- SIEM -->
    <rect x="100" y="360" width="180" height="130" rx="5" fill="#d7ccc8"/>
    <text x="190" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#3e2723">SIEM</text>
    <text x="190" y="405" text-anchor="middle" font-family="Arial" font-size="10">- Log Aggregation</text>
    <text x="190" y="425" text-anchor="middle" font-family="Arial" font-size="10">- Event Correlation</text>
    <text x="190" y="445" text-anchor="middle" font-family="Arial" font-size="10">- Threat Detection</text>

    <!-- Monitoring -->
    <rect x="310" y="360" width="180" height="130" rx="5" fill="#d7ccc8"/>
    <text x="400" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#3e2723">Monitoring</text>
    <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="10">- Continuous Monitoring</text>
    <text x="400" y="425" text-anchor="middle" font-family="Arial" font-size="10">- Security Metrics</text>
    <text x="400" y="445" text-anchor="middle" font-family="Arial" font-size="10">- Compliance Tracking</text>

    <!-- Incident Response -->
    <rect x="520" y="360" width="180" height="130" rx="5" fill="#d7ccc8"/>
    <text x="610" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#3e2723">Incident Response</text>
    <text x="610" y="405" text-anchor="middle" font-family="Arial" font-size="10">- Response Plans</text>
    <text x="610" y="425" text-anchor="middle" font-family="Arial" font-size="10">- Playbooks</text>
    <text x="610" y="445" text-anchor="middle" font-family="Arial" font-size="10">- Recovery Procedures</text>

    <!-- Compliance Labels -->
    <rect x="90" y="520" width="140" height="20" rx="5" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
    <text x="160" y="534" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">FedRAMP High</text>

    <rect x="240" y="520" width="140" height="20" rx="5" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
    <text x="310" y="534" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">NIST 800-53</text>

    <rect x="390" y="520" width="140" height="20" rx="5" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
    <text x="460" y="534" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">DoD SRG</text>

    <rect x="540" y="520" width="140" height="20" rx="5" fill="#fff" stroke="#2c3e50" stroke-width="1"/>
    <text x="610" y="534" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">GOV STIG</text>
</svg>
